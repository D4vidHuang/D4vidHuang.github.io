name: Update Google Scholar snapshot

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh Scholar metrics
        id: refresh
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py

      - name: Explain a preserved last-known-good snapshot
        if: steps.refresh.outcome == 'failure'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        shell: bash
        run: |
          if [ -n "${SERPAPI_KEY}" ]; then
            echo "::error::Scholar refresh failed even though SERPAPI_KEY is configured. The previous verified snapshot was preserved."
            exit 1
          fi

          echo "::warning::Google blocked the public-profile refresh. Add the SERPAPI_KEY repository secret for reliable hosted updates; the previous verified snapshot was preserved."
          {
            echo "### Google Scholar snapshot preserved"
            echo
            echo "Google blocked the public-profile request and no SerpAPI key is configured. The website continues to show its dated, last-verified snapshot."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit the daily verified snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "Google Scholar metrics were already verified today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "chore: update Google Scholar snapshot"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
